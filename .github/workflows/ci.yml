
name: Comprobaciones iniciales

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff pytest

      - name: Comprobar sintaxis Python
        run: python -m compileall -q src apps scripts

      - name: Validar metadatos
        run: python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text())"

      - name: Analizar codigo con Ruff
        run: ruff check src apps scripts tests

      - name: Ejecutar pruebas con Pytest
        run: |
          if find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest -q
          else
            echo "Todavia no hay tests. Se omite Pytest."
          fi

